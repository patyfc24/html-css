<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Desafio Flexbox</title>

<style>

.container{
    display:flex;
    background-color:lightgray;
}

.item{
    border:1px solid black;
    text-align:center;
    font-size:20px;
    color:white;
    padding:20px;
}

/* pequeno */
#a{
    background-color:red;
    flex-grow:1;
}

/* grande */
#b{
    background-color:blue;
    flex-grow:2;
}

/* pequeno */
#c{
    background-color:green;
    flex-grow: 4;
}

</style>
</head>

<body>

<h2>Desafio Flexbox</h2>

<div class="container">

<div class="item" id="a">A</div>
<div class="item" id="b">B</div>
<div class="item" id="c">C</div>

</div>

</body>
</html>
