<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Desafio Flexbox</title>

<style>

.container{
    display:flex;
    background-color:lightgray;
    padding:10px;
}

.item{
    background-color:green;
    border:1px solid black;
    padding:20px;
    margin:5px;
    color:white;
    font-size:20px;
}

/* empurra C para a direita */
#c{
    margin-left:auto;/*O margin-left:auto faz o navegador empurrar o elemento o máximo possível para a direita.*/
    background-color:red;
}

</style>
</head>

<body>

<div class="container">

<div class="item">A</div>
<div class="item">B</div>
<div class="item" id="c">C</div>

</div>

</body>
</html>
