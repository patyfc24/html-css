<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box centralizado</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body {
        background-color: darkkhaki;
        }
        main {
        background-color: darkcyan;
        height: 90vh;
        width: 90vw;
        display: flex;/*pai*/
        flex-flow: nowrap;
        justify-content: center;
        align-items: center;
        }
        section {
        background-color: rgb(0, 2, 100);
        height: 200px;
        width: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
</body>
</html>
