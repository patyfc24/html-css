<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid layout na prática</title>
    <style>
        div.container {
            /*xxxxx grid explicito xxxxxx*/
            border: 3px solid blue;
            height: 250px;
            display: grid;
            grid-template-columns: auto auto auto;/*gri-templat*/
            grid-template-rows: auto auto auto;/*grid-templat 1 vem rows na declaraçao */
            
            gap: 5px;
            grid-auto-rows: 100px; /*grid implicito linha cresce para baixo*/
            grid-auto-columns: 100px;/*coloca coluna cresce para lado*/

            /* align-items: stretch;           place-items
            justify-items: stretch;          place-items*/
            place-items: stretch center;

            /*align-content: stretch;    *place-content
            justify-content: stretch;     *place-content*/
            place-content: start start;
        }
        div.item {
            border: 3px solid red;
            padding: 10px;
        }
        
    </STyle>
</head>
<body>
    <div class="container">
    <div class="item">A</div>
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">D</div>
    <div class="item">E</div>
    <div class="item">F</div>
    <div class="item">G</div>
</div>
</body>
</html>
