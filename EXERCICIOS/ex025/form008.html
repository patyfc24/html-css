<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste em Formulários</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
        <label for="in1">Numero 1</label>
        <input type="number" name="n1" id="in1" min="0" max="50"  oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>

        <p>
        <label for="in2">Numero 2</label>
        <input type="number" name="n2" id="in2" min="0" max="50"  
        oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>
        <p>
        <label for="isoma">Soma:</label>
        <output name="isoma" id="soma">0</output><!--o output tem que ser mesmo nome do ide-->
        </p>


        <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>




    </form>
</body>
</html>
