<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="cadastro.php" method="get">
        <p>
            <label for="ifoto">Foto do perfil</label>
            <input type="file" name="Foto" id="ifoto" accept="image/*">
        </p>

        <p>
            <label for="idade">iidade</label>
            <input type="number" name="idade" id="iidade" min="1" max="120" value="20">            
        </p>
        <p>
            <fieldset style="width: 100px;">
            <legend>Sexo</legend>
            <input type="radio" name="sex" id="isexmas c" checked>
            <label for="isexmas c">Masculino</label>
            <input type="radio" name="sex" id="isexfem">
            <label for="isexfem">Feminino</label></fieldset>
        </p>
        <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" pattern="\([0-9]{2}\)([\s])[0-9]{4-6}-[0-9]{4}" placeholder="(xx)xxxx-xxxx"><!--sabe o que é--> 
        </p>
        <p>
            <label for="imail">E-mail</label>
            <input type="email" name="mail" id="imail" size="30" maxlength="50">   
        </p>
        <p>
            <label for="isenha">Senha</label>
            <input type="password" name="senha" id="isenha" minlength="3" maxlength="8" size="8">
        </p>
        <p>
            <label for="imes">Mês do Aniversário</label>
            <input type="month" name="mes" id="imes">
        </p>
        <p>
            <label for="idata">Dia da Compra</label>
            <input type="date" name="data" id="idata">
        </p>
        <p>
            <label for="ihora">Hora da Compra</label>
            <input type="time" name="hora" id="ihora">
        </p>
        <p>
            <label for="icor">Cor</label>
            <input type="color" name="Cor" id="icor" value="#000000">
        </p>
        <p>
            <label for="isat">Nivel de Satisfação</label>
            <input type="range" name="sat" id="isat" min="0" max="4" value="2">
        </p>
        <p>
            <input type="checkbox" name="aceito" id="iaceito">
            <label for="iaceito">Aceito os <a href="termos.html">Termos de uso</a></label>
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
        <p>
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
