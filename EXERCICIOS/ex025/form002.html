<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Teste de Formulário</h1>

    <form action="cadastro.php" method="post" autocomplete="on"> <!--AJUDA A EXIBIR COM NAVEGADOR A PALAVRA QUE PODE SER PARA AQUELA CAIXA  E CONFIGURAR PARA CA CAIXA O QUEW É-->

    <label for="iusu">Usuário:</label>
    <input type="text" name="usu" id="iusu" required minlength="5" maxlength="15" size="5" placeholder="nome de usuário"><!--DICA QUE APARECE NA CAIXA DO QUE ESCREVER USER NAME -->

    <p>
        <label for="iesen">Senha</label>
        <input type="password" name="Sen" id="iesen" required minlength="8" autocomplete="current-password"><!--PARA LOGIN-->
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>
</body>
</html>
